  <clipPath id="cl"><rect width="440" height="306" rx="20"/></clipPath>
</defs>
<style>.gl{animation:gl 6s ease-in-out infinite alternate}@keyframes gl{to{transform:translate(-30px,20px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

<svg xmlns="http://www.w3.org/2000/svg" width="440" height="306" viewBox="0 0 440 306" role="img" aria-label="gestion-salon: App móvil para una peluquería real: ingresos, gastos, clientes, citas con recordatorios, reportes PDF/CSV y respaldo. Sin backend.">
